<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="368" viewBox="0 0 1600 368" role="img" aria-label="AagriGgate — Direct farm-to-buyer trade and decision support platform. Direct farm-to-buyer trade and decision support platform." fill="none">
