<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="380" viewBox="0 0 1600 380" role="img" aria-label="Got an idea? Let's ship it. Start a project with Joylan" fill="none">
