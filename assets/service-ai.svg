  <g class="pop" style="animation-delay:0.1s"><rect x="146" y="80" width="186" height="38" rx="14" fill="#8B5CF6"/><text x="162" y="104" style="font:600 13px 'Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,'SF Pro Display',Inter,Roboto,'Helvetica Neue',Arial,sans-serif" class="w">Summarise this week's sales</text></g>
