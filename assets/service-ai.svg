  <g class="reply"><rect x="38" y="132" width="264" height="74" rx="14" fill="#151933"/>
    <text x="54" y="160" style="font:600 13px 'Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,'SF Pro Display',Inter,Roboto,'Helvetica Neue',Arial,sans-serif" class="w">Revenue ↑ 24% vs last week</text>
    <text x="54" y="186" style="font:500 13px 'Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,'SF Pro Display',Inter,Roboto,'Helvetica Neue',Arial,sans-serif" fill="#9095AD">3 follow-ups drafted for you ✓</text></g>
