<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="428" viewBox="0 0 1600 428" role="img" aria-label="AI Agents &amp; Automation — LLM assistants, chatbots and workflow automation that save your team hours." fill="none">
<title>AI Agents &amp; Automation — LLM assistants, chatbots and workflow automation that save your team hours.</title>

<defs>
    <clipPath id="sClip"><rect width="1600" height="400" rx="28"/></clipPath>
    <linearGradient id="sEdge" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1600" y2="400">
      <stop offset="0" stop-color="#F75C7E" stop-opacity="0.9"/>
      <stop offset="0.35" stop-color="#8B5CF6" stop-opacity="0.15"/>
      <stop offset="0.65" stop-color="#22D3EE" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0.9"/>
      <animateTransform attributeName="gradientTransform" type="rotate" values="0 800 200;360 800 200" dur="14s" repeatCount="indefinite"/>
    </linearGradient>
  <linearGradient id="br" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#F75C7E"/>
    <stop offset="0.5" stop-color="#8B5CF6"/>
    <stop offset="1" stop-color="#22D3EE"/>
  </linearGradient>
  <linearGradient id="brv" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#8B5CF6"/><stop offset="1" stop-color="#F75C7E"/></linearGradient>
  <linearGradient id="img" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8B5CF6"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
  <radialGradient id="sg" cx=".8" cy=".5" r=".5"><stop offset="0" stop-color="#8B5CF6" stop-opacity=".28"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient>
  <clipPath id="art"><rect width="560" height="320" rx="20"/></clipPath>
</defs>
<style>
  .grow{transform-box:fill-box;transform-origin:left center;animation:grow 6s cubic-bezier(.6,0,.2,1) infinite both}
  @keyframes grow{0%{transform:scaleX(0)}14%,86%{transform:scaleX(1)}96%,100%{transform:scaleX(0)}}
  .rise{transform-box:fill-box;transform-origin:center bottom;animation:rise 6s cubic-bezier(.6,0,.2,1) infinite both}
  @keyframes rise{0%{transform:scaleY(0)}14%,86%{transform:scaleY(1)}96%,100%{transform:scaleY(0)}}
  .pop{transform-box:fill-box;transform-origin:center;animation:pop 6s cubic-bezier(.3,1.6,.5,1) infinite both}
  @keyframes pop{0%{transform:scale(0);opacity:0}10%,86%{transform:scale(1);opacity:1}96%,100%{transform:scale(0);opacity:0}}
  .slide{animation:slide 6s cubic-bezier(.2,.8,.2,1) infinite both}
  @keyframes slide{0%{transform:translateX(40px);opacity:0}10%,86%{transform:none;opacity:1}96%,100%{transform:translateX(-20px);opacity:0}}
  .draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 6s cubic-bezier(.6,0,.2,1) infinite both}
  @keyframes draw{0%{stroke-dashoffset:1}30%,86%{stroke-dashoffset:0}100%{stroke-dashoffset:-1}}
  .flow{animation:flow 1s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-16}}
  .blink{animation:blink 1.4s steps(1) infinite}
  @keyframes blink{50%{opacity:.25}}
  .lbl{font:600 15px 'JetBrains Mono','Cascadia Code','SF Mono',SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace;fill:#9095AD}
  .tiny{font:600 13px 'JetBrains Mono','Cascadia Code','SF Mono',SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace;fill:#9095AD}
  .w{fill:#fff}
  .typing{animation:typing 6s infinite both}
  @keyframes typing{0%,14%{opacity:0}18%,40%{opacity:1}44%,100%{opacity:0}}
  .reply{animation:reply 6s cubic-bezier(.2,.8,.2,1) infinite both}
  @keyframes reply{0%,42%{opacity:0;transform:translateY(10px)}48%,90%{opacity:1;transform:none}100%{opacity:0}}
  .reply2{animation:reply 6s cubic-bezier(.2,.8,.2,1) infinite both;animation-delay:.5s}
  .dot{animation:bounce .9s ease-in-out infinite}
  @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  .halo{transform-box:fill-box;transform-origin:center;animation:halo 2.4s ease-in-out infinite}
  @keyframes halo{50%{transform:scale(1.25);opacity:.5}}
  .k{font:600 22px 'JetBrains Mono','Cascadia Code','SF Mono',SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace;letter-spacing:5px;fill:#9095AD}
  .t{font:800 64px 'Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,'SF Pro Display',Inter,Roboto,'Helvetica Neue',Arial,sans-serif;letter-spacing:-2px;fill:#F4F4F8}
  .dsc{font:500 30px 'Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,'SF Pro Display',Inter,Roboto,'Helvetica Neue',Arial,sans-serif;fill:#9095AD}
  .chip{font:600 19px 'JetBrains Mono','Cascadia Code','SF Mono',SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace;fill:#F4F4F8}
  .num{font:800 200px 'Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,'SF Pro Display',Inter,Roboto,'Helvetica Neue',Arial,sans-serif;fill:none;stroke:rgba(255,255,255,.05);stroke-width:2}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
