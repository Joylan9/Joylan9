<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="760" height="128" viewBox="0 0 760 128" role="img" aria-label="Explore my portfolio" fill="none">
<title>Explore my portfolio</title>

<defs>
  <linearGradient id="b" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#F75C7E"/>
    <stop offset="0.5" stop-color="#8B5CF6"/>
    <stop offset="1" stop-color="#22D3EE"/>
  </linearGradient>
  <linearGradient id="bm" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="760" y2="0">
    <stop offset="0" stop-color="#F75C7E"/><stop offset=".5" stop-color="#8B5CF6"/><stop offset="1" stop-color="#22D3EE"/>
    <animateTransform attributeName="gradientTransform" type="translate" values="0;-380;0" dur="6s" repeatCount="indefinite"/>
  </linearGradient>
  <clipPath id="c"><rect width="760" height="128" rx="64"/></clipPath>
  <linearGradient id="sh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
</defs>
<style>
  .t{font:800 40px 'Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,'SF Pro Display',Inter,Roboto,'Helvetica Neue',Arial,sans-serif;fill:#fff;letter-spacing:.5px}
  .s{animation:s 3.6s ease-in-out infinite}
  @keyframes s{0%{transform:translateX(-260px)}50%,100%{transform:translateX(1020px)}}
  .a{animation:a 1.6s ease-in-out infinite}
  @keyframes a{0%,100%{transform:translateX(0)}50%{transform:translateX(8px)}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<g clip-path="url(#c)">
  <rect width="1140" height="128" fill="url(#bm)"/>
  <rect width="760" height="128" fill="#06070D" fill-opacity=".12"/>
  <rect x="0" y="0" width="200" height="128" fill="url(#sh)" class="s"/>
</g>
<rect x="1.5" y="1.5" width="757" height="125" rx="62.5" stroke="#fff" stroke-opacity=".35" stroke-width="3"/>
<g stroke="#fff" stroke-width="4" fill="none" transform="translate(110 64)"><circle r="24"/><ellipse rx="10" ry="24"/><path d="M-24 0 H24 M-20 -12 H20 M-20 12 H20"/></g>
<text x="410" y="78" text-anchor="middle" class="t">Explore my portfolio</text>
<g class="a"><path d="M640 64 H676 M660 46 L678 64 L660 82" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g>
</svg>
