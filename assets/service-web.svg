<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="428" viewBox="0 0 1600 428" role="img" aria-label="Websites &amp; Landing Pages — Fast, SEO-ready, beautifully animated sites that turn visitors into customers." fill="none">
<title>Websites &amp; Landing Pages — Fast, SEO-ready, beautifully animated sites that turn visitors into customers.</title>

<defs>
    <clipPath id="sClip"><rect width="1600" height="400" rx="28"/></clipPath>
    <linearGradient id="sEdge" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1600" y2="400">
      <stop offset="0" stop-color="#F75C7E" stop-opacity="0.9"/>
      <stop offset="0.35" stop-color="#8B5CF6" stop-opacity="0.15"/>
      <stop offset="0.65" stop-color="#22D3EE" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0.9"/>
