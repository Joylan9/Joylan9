  <path d="M0 385 q 80 -22 160 0 t 160 0 q 80 -22 160 0 t 160 0 q 80 -22 160 0 t 160 0 q 80 -22 160 0 t 160 0 q 80 -22 160 0 t 160 0 q 80 -22 160 0 t 160 0 q 80 -22 160 0 t 160 0 q 80 -22 160 0 t 160 0 q 80 -22 160 0 t 160 0 q 80 -22 160 0 t 160 0 q 80 -22 160 0 t 160 0 V 440 H 0 Z" fill="url(#fw2)" opacity=".45" class="w2"/>
  <text x="800" y="112" text-anchor="middle" class="big">Thanks for stopping by ✦</text>
  <g class="q" style="animation-delay:0s"><text x="800" y="210" text-anchor="middle" class="qt">“The best way to predict the future is to build it.”</text><text x="800" y="260" text-anchor="middle" class="qa">— Alan Kay</text></g><g class="q" style="animation-delay:5s"><text x="800" y="210" text-anchor="middle" class="qt">“Make it work, make it right, make it fast.”</text><text x="800" y="260" text-anchor="middle" class="qa">— Kent Beck</text></g><g class="q" style="animation-delay:10s"><text x="800" y="210" text-anchor="middle" class="qt">“Simplicity is the soul of efficiency.”</text><text x="800" y="260" text-anchor="middle" class="qa">— Austin Freeman</text></g><g class="q" style="animation-delay:15s"><text x="800" y="210" text-anchor="middle" class="qt">“First, solve the problem. Then, write the code.”</text><text x="800" y="260" text-anchor="middle" class="qa">— John Johnson</text></g>
  <text x="800" y="418" text-anchor="middle" class="sig">CRAFTED WITH CODE &amp; COFFEE · JOYLAN DSOUZA</text>
</g>
<rect x="1" y="1" width="1598" height="438" rx="31" stroke="rgba(255,255,255,.1)" stroke-width="2"/>
