<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="440" viewBox="0 0 1600 440" role="img" aria-label="Thanks for stopping by" fill="none">
<title>Thanks for stopping by</title>

<defs>
  <linearGradient id="fb" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#F75C7E"/>
    <stop offset="0.5" stop-color="#8B5CF6"/>
    <stop offset="1" stop-color="#22D3EE"/>
  </linearGradient>
  <clipPath id="fc"><rect width="1600" height="440" rx="32"/></clipPath>
  <linearGradient id="fw1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F75C7E"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient>
  <linearGradient id="fw2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8B5CF6"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
</defs>
<style>
  .big{font:800 64px 'Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,'SF Pro Display',Inter,Roboto,'Helvetica Neue',Arial,sans-serif;fill:url(#fb);letter-spacing:-1.5px}
  .qt{font:italic 500 34px 'Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,'SF Pro Display',Inter,Roboto,'Helvetica Neue',Arial,sans-serif;fill:#F4F4F8}
  .qa{font:500 24px 'JetBrains Mono','Cascadia Code','SF Mono',SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace;fill:#9095AD;letter-spacing:2px}
  .q{opacity:0;animation:q 20s infinite}
  @keyframes q{0%{opacity:0;transform:translateY(12px)}4%,21%{opacity:1;transform:none}25%,100%{opacity:0;transform:translateY(-12px)}}
  .w1{animation:w 14s linear infinite}.w2{animation:w 9s linear infinite reverse}.w3{animation:w 20s linear infinite}
  @keyframes w{to{transform:translateX(-1600px)}}
  .sig{font:500 22px 'JetBrains Mono','Cascadia Code','SF Mono',SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace;fill:#F4F4F8;opacity:.85;letter-spacing:3px}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
