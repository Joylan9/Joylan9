  <rect width="1600" height="440" fill="#0C0E1A"/>
  <path d="M0 340 q 100 -26 200 0 t 200 0 q 100 -26 200 0 t 200 0 q 100 -26 200 0 t 200 0 q 100 -26 200 0 t 200 0 q 100 -26 200 0 t 200 0 q 100 -26 200 0 t 200 0 q 100 -26 200 0 t 200 0 q 100 -26 200 0 t 200 0 q 100 -26 200 0 t 200 0 V 440 H 0 Z" fill="url(#fw2)" opacity=".18" class="w3"/>
