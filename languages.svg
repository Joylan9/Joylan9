<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-label="Top languages: TypeScript 33.3%, JavaScript 26.4%, Python 20.3%, CSS 9.0%, Dart 8.3%, HTML 2.7%" fill="none">
<title>Top languages: TypeScript 33.3%, JavaScript 26.4%, Python 20.3%, CSS 9.0%, Dart 8.3%, HTML 2.7%</title>

<defs>
    <clipPath id="lClip"><rect width="1600" height="560" rx="28"/></clipPath>
    <linearGradient id="lEdge" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1600" y2="560">
      <stop offset="0" stop-color="#F75C7E" stop-opacity="0.9"/>
      <stop offset="0.35" stop-color="#8B5CF6" stop-opacity="0.15"/>
      <stop offset="0.65" stop-color="#22D3EE" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0.9"/>
      <animateTransform attributeName="gradientTransform" type="rotate" values="0 800 280;360 800 280" dur="14s" repeatCount="indefinite"/>
    </linearGradient>
  <linearGradient id="lB" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#F75C7E"/>
    <stop offset="0.5" stop-color="#8B5CF6"/>
    <stop offset="1" stop-color="#22D3EE"/>
  </linearGradient></defs>
<style>
  @keyframes s0{from{stroke-dasharray:0 100}to{stroke-dasharray:32.74 67.26}}
  @keyframes s1{from{stroke-dasharray:0 100}to{stroke-dasharray:25.84 74.16}}
  @keyframes s2{from{stroke-dasharray:0 100}to{stroke-dasharray:19.67 80.33}}
  @keyframes s3{from{stroke-dasharray:0 100}to{stroke-dasharray:8.43 91.57}}
  @keyframes s4{from{stroke-dasharray:0 100}to{stroke-dasharray:7.66 92.34}}
  @keyframes s5{from{stroke-dasharray:0 100}to{stroke-dasharray:2.06 97.94}}
  .in{opacity:0;animation:in .7s cubic-bezier(.2,.8,.2,1) forwards}
  @keyframes in{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
  .bar{transform-box:fill-box;transform-origin:left;animation:grow 1.1s cubic-bezier(.6,0,.2,1) both}
  @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  .k{font:600 22px 'JetBrains Mono','Cascadia Code','SF Mono',SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace;letter-spacing:5px;fill:#9095AD}
  .ln{font:600 30px 'Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,'SF Pro Display',Inter,Roboto,'Helvetica Neue',Arial,sans-serif;fill:#F4F4F8}
  .lp{font:600 26px 'JetBrains Mono','Cascadia Code','SF Mono',SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace;fill:#9095AD}
  .c1{font:800 64px 'Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,'SF Pro Display',Inter,Roboto,'Helvetica Neue',Arial,sans-serif;fill:#F4F4F8;letter-spacing:-2px}
  .c2{font:600 18px 'JetBrains Mono','Cascadia Code','SF Mono',SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace;letter-spacing:3px;fill:#9095AD}
  .spin{transform-origin:300px 290px;animation:spin 30s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<g clip-path="url(#lClip)">
  <rect width="1600" height="560" rx="28" fill="#0C0E1A"/>
