      <circle cx="629" cy="221" r="9" fill="#F1E05A"/>
      <text x="652" y="230" class="ln">JavaScript</text>
      <text x="1000" y="230" text-anchor="end" class="lp">26.4%</text>
      <rect x="620" y="248" width="380" height="8" rx="4" fill="rgba(255,255,255,.06)"/>
      <rect x="620" y="248" width="301.4" height="8" rx="4" fill="#F1E05A" class="bar" style="animation-delay:0.68s"/>
    </g><g class="in" style="animation-delay:0.56s">
      <circle cx="629" cy="321" r="9" fill="#3572A5"/>
