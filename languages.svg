  <circle cx="300" cy="290" r="170" pathLength="100" stroke="#3178C6" stroke-width="46" stroke-dashoffset="0.00" style="animation:s0 1.2s 0.30s cubic-bezier(.6,0,.2,1) both" transform="rotate(-90 300 290)"/><circle cx="300" cy="290" r="170" pathLength="100" stroke="#F1E05A" stroke-width="46" stroke-dashoffset="-33.34" style="animation:s1 1.2s 0.42s cubic-bezier(.6,0,.2,1) both" transform="rotate(-90 300 290)"/><circle cx="300" cy="290" r="170" pathLength="100" stroke="#3572A5" stroke-width="46" stroke-dashoffset="-59.78" style="animation:s2 1.2s 0.54s cubic-bezier(.6,0,.2,1) both" transform="rotate(-90 300 290)"/><circle cx="300" cy="290" r="170" pathLength="100" stroke="#663399" stroke-width="46" stroke-dashoffset="-80.05" style="animation:s3 1.2s 0.66s cubic-bezier(.6,0,.2,1) both" transform="rotate(-90 300 290)"/><circle cx="300" cy="290" r="170" pathLength="100" stroke="#00B4AB" stroke-width="46" stroke-dashoffset="-89.08" style="animation:s4 1.2s 0.78s cubic-bezier(.6,0,.2,1) both" transform="rotate(-90 300 290)"/><circle cx="300" cy="290" r="170" pathLength="100" stroke="#E34C26" stroke-width="46" stroke-dashoffset="-97.34" style="animation:s5 1.2s 0.90s cubic-bezier(.6,0,.2,1) both" transform="rotate(-90 300 290)"/>
  <circle cx="300" cy="290" r="214" stroke="url(#lB)" stroke-width="2" stroke-dasharray="2 12" class="spin" opacity=".6"/>
  <text x="300" y="300" text-anchor="middle" class="c1">6</text>
  <text x="300" y="336" text-anchor="middle" class="c2">LANGUAGES</text>
