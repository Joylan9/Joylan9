    </g><g class="in" style="animation-delay:0.64s">
      <circle cx="1099" cy="121" r="9" fill="#663399"/>
      <text x="1122" y="130" class="ln">CSS</text>
      <text x="1470" y="130" text-anchor="end" class="lp">9.0%</text>
      <rect x="1090" y="148" width="380" height="8" rx="4" fill="rgba(255,255,255,.06)"/>
      <rect x="1090" y="148" width="102.9" height="8" rx="4" fill="#663399" class="bar" style="animation-delay:0.84s"/>
    </g><g class="in" style="animation-delay:0.72s">
      <circle cx="1099" cy="221" r="9" fill="#00B4AB"/>
      <text x="1122" y="230" class="ln">Dart</text>
      <text x="1470" y="230" text-anchor="end" class="lp">8.3%</text>
      <rect x="1090" y="248" width="380" height="8" rx="4" fill="rgba(255,255,255,.06)"/>
      <rect x="1090" y="248" width="94.1" height="8" rx="4" fill="#00B4AB" class="bar" style="animation-delay:0.92s"/>
    </g><g class="in" style="animation-delay:0.80s">
      <circle cx="1099" cy="321" r="9" fill="#E34C26"/>
      <text x="1122" y="330" class="ln">HTML</text>
      <text x="1470" y="330" text-anchor="end" class="lp">2.7%</text>
      <rect x="1090" y="348" width="380" height="8" rx="4" fill="rgba(255,255,255,.06)"/>
      <rect x="1090" y="348" width="30.3" height="8" rx="4" fill="#E34C26" class="bar" style="animation-delay:1.00s"/>
